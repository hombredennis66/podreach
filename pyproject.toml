[project]
name = "podreach"
version = "0.1.0"
description = "Podcast-based outreach automation - find episodes, transcribe, draft personalized emails"
readme = "README.md"
authors = [
    { name = "Alex", email = "qlaiseq@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "httpx>=0.27.0",
    "deepgram-sdk>=3.0.0",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
podreach = "podreach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
